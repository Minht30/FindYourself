  @keyframes cloudDrift { 0% { transform: translateX(-30vw); opacity: 0; } 30% { opacity: var(--co, .85); } 90% { opacity: var(--co, .85); } 100% { transform: translateX(130vw); opacity: 0; } }
  /* fan flowers: a tapered two-part stem that bends in the wind (the upper part whips more), leaves that flutter, a head that spins like a pinwheel */

  .seg { position: absolute; left: 0; width: 0; transform-origin: 50% 100%; }
  .seg1 { bottom: 0; height: 56%; animation: bend1 4.8s ease-in-out infinite; }
  .seg2 { bottom: 100%; height: 78%; animation: bend2 4.8s ease-in-out infinite; animation-delay: -.55s; }
  .seg svg.st { position: absolute; left: -7px; bottom: 0; width: 14px; height: 100%; overflow: visible; }
  .leaf { position: absolute; width: 64px; height: 22px; animation: flutter 2.6s ease-in-out infinite alternate; }
  .leaf.right { left: 2px; transform-origin: 0 60%; }

  .bars i:nth-child(2) { animation-delay: -.3s; } .bars i:nth-child(3) { animation-delay: -.6s; } .bars i:nth-child(4) { animation-delay: -.15s; }

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="ph" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F2FDFD" stop-opacity=".55"/><stop offset=".5" stop-color="#C9F1F2" stop-opacity=".32"/><stop offset="1" stop-color="#9BE6D7" stop-opacity="0"/></radialGradient>
    <radialGradient id="pb" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#FAFFFF"/><stop offset=".6" stop-color="#E2F8F8"/><stop offset="1" stop-color="#BDEBEC"/></radialGradient>
    <symbol id="puff" viewBox="0 0 48 48"><circle cx="24" cy="24" r="23" fill="url(#ph)"/><g id="fil"></g><circle cx="24" cy="24" r="8.6" fill="url(#pb)" stroke="#9FDDE0" stroke-opacity=".7" stroke-width=".8"/></symbol>
  </defs>
</svg>

<div class="scene" id="scene">
  <div class="layer" data-depth="8"><div class="stage" id="stage"><div class="wall"></div></div></div>
  <div class="layer" id="clouds" data-depth="10"></div>
  <div class="layer haze"></div>
  <div class="layer rays"></div>
  <div class="layer" id="seeds" data-depth="22"></div>
  
  <div class="layer" id="fly" style="pointer-events:none"></div>
  <div class="layer" id="plants"></div>
  <div class="layer vignette"></div>

  <div class="ui"><div class="title">Chill</div>
    <button class="chillmode" id="cm" aria-label="Chill mode">⤢ Chill mode</button></div>

  <div class="settings" id="settings" role="dialog" aria-label="Sound settings">
    <h2>Sound settings</h2>
    <label class="srow">Wind volume <input id="vol" type="range" min="0" max="100" value="55"></label>
    <label class="srow">Gust strength <input id="gs" type="range" min="0" max="100" value="60"></label>
    <p>The wind here is synthesized, a stand-in for the feel. Monstadt recordings come later as a mix called "Windy meadow". Rain, fireplace, keyboard, café chatter and piano stay in the app's mixer.</p>
  </div>
  <div class="bar ui" id="bar">
    <button class="btn main" id="play" aria-label="Play wind">▶</button>
    <div class="meta"><b>Windy meadow</b><small id="state">paused</small></div>
    <div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <input id="vol2" type="range" min="0" max="100" value="55" aria-label="Volume">
    <button class="pill" id="sbtn" aria-expanded="false">⚙ Sound settings</button>
  </div>
</div>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (s) => document.querySelector(s);
  const scene = $('#scene');
  const rnd = (a, b) => a + Math.random() * (b - a);
  let G = .6; // gust strength 0..1

  // filaments for the seed symbol
  let f = '';
  for (let i = 0; i < 24; i++) { const a = i * 15 * Math.PI / 180, r2 = i % 2 ? 16.5 : 20, x1 = 24 + 8 * Math.cos(a), y1 = 24 + 8 * Math.sin(a), x2 = 24 + r2 * Math.cos(a), y2 = 24 + r2 * Math.sin(a);
    f += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#8FD6D8" stroke-opacity=".35" stroke-width="1.9" stroke-linecap="round"/><line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#F1FCFC" stroke-opacity=".9" stroke-width=".9" stroke-linecap="round"/><circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="1.15" fill="#F1FCFC" fill-opacity=".9"/>`; }
  $('#fil').innerHTML = f;

  // fit the stage like background-size: cover with the picture pinned to the right and 40 percent down
  const stage = $('#stage');
  const fit = () => { const W = innerWidth, H = innerHeight, s = Math.max(W / 1623, H / 640) * 1.015, w = 1623 * s, h = 640 * s;
    const ox = (W - w) + Math.min(12, (w - W) / 2), oy = (H - h) * .4; stage.style.transform = `translate(${ox.toFixed(1)}px,${oy.toFixed(1)}px) scale(${s.toFixed(4)})`; };
  addEventListener('resize', fit); fit();

  // clouds (faster)
  [[2, 330, 70], [8, 250, 95], [1, 400, 120], [12, 220, 60]].forEach(([top, w, dur], i) => {
    const c = document.createElement('div'); c.className = 'cloud';
    c.style.cssText = `top:${top}vh;width:${w}px;height:${w * .68}px;animation-duration:${dur}s;animation-delay:${-rnd(0, dur)}s;--co:${.9 - i * .05}`; $('#clouds').appendChild(c); });

  // dandelion seeds (quicker)
  for (let i = 0; i < 11; i++) { const s = document.createElement('div'); s.className = 'seed'; const size = rnd(18, 42);
    s.style.cssText = `--y0:${rnd(30, 85)}vh;animation-duration:${rnd(14, 28)}s;animation-delay:${-rnd(0, 28)}s;opacity:${rnd(.45, .85)}`;
    s.innerHTML = `<svg width="${size}" height="${size}" style="animation-duration:${rnd(2.2, 4)}s;animation-delay:${-rnd(0, 4)}s"><use href="#puff"/></svg>`; $('#seeds').appendChild(s); }

  // fan flowers: stem leans with the wind, head spins like a pinwheel
  const heads = [];
  const stem = '<svg class="st" viewBox="0 0 14 100" preserveAspectRatio="none"><defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#4F7A3A"/><stop offset=".5" stop-color="#8DB35B"/><stop offset="1" stop-color="#58823F"/></linearGradient></defs><path d="M2 100 C3.5 70 5.2 30 5.6 0 L8.4 0 C8.8 30 10.5 70 12 100 Z" fill="url(#sg)" stroke="rgba(40,70,30,.35)" stroke-width=".6" vector-effect="non-scaling-stroke"/></svg>';
  const plantLeaf = (side, pos, r, id) => `<div class="leaf ${side}" style="bottom:${pos}%;--r:${r}deg;animation-delay:${-rnd(0, 2.6)}s"><svg viewBox="0 0 64 22" width="64" height="22" style="${side === 'left' ? 'transform:scaleX(-1)' : ''}"><defs><linearGradient id="lg${id}" x1="0" x2="1"><stop offset="0" stop-color="#4F7A3A"/><stop offset="1" stop-color="#A5CC6A"/></linearGradient></defs><path d="M0 11 C12 1 40 0 64 11 C40 21 12 21 0 11Z" fill="url(#lg${id})" stroke="rgba(40,70,30,.3)" stroke-width=".6"/><path d="M2 11 C20 9 44 9.5 60 11" stroke="rgba(255,255,255,.35)" stroke-width=".8" fill="none"/></svg></div>`;
  [[7, 40, 150, 7, 1.0], [91, 34, 124, 6, -1.0], [19, 24, 84, 5, 1.2], [82, 20, 70, 5, -1.2], [97, 28, 96, 6, 1.1]].forEach(([x, h, s, a, dir], i) => {
    const p = document.createElement('div'); p.className = 'plant'; p.style.cssText = `left:${x}vw;--h:${h}vh;--s:${s}px;--a:${a}deg`;
    const sd = i % 2 ? ['left', 'right'] : ['right', 'left'];
    p.innerHTML = `<div class="seg seg1">${stem}${plantLeaf(sd[0], 34, sd[0] === 'right' ? -32 : 32, i + 'a')}<div class="seg seg2">${stem}${plantLeaf(sd[1], 40, sd[1] === 'right' ? -26 : 26, i + 'b')}<div class="head"></div></div></div>`; $('#plants').appendChild(p);
    heads.push({ el: p.querySelector('.head'), ang: rnd(0, 360), dir, k: rnd(.85, 1.2) }); });

  // birds
  const bird = () => { if (document.hidden || reduce) return; const b = document.createElement('div'); b.className = 'fly bird'; const sz = rnd(26, 40);
    b.innerHTML = `<svg width="${sz}" height="${sz * .42}" viewBox="0 0 24 10" fill="none" stroke="#1E384F" stroke-width="1.5" stroke-linecap="round"><path d="M1 8 Q6 0 12 6 Q18 0 23 8"/></svg>`; $('#fly').appendChild(b);
    const y = rnd(8, 40), dur = rnd(10, 18) * 1000; const a = b.animate([{ transform: `translate(-6vw,${y}vh)` }, { transform: `translate(110vw,${y - rnd(4, 14)}vh)` }], { duration: dur, easing: 'linear' }); a.onfinish = () => b.remove(); };
  setTimeout(bird, 1000); setInterval(bird, 6000);

  // gusts: faster and stronger than draft 1
  let gusting = false;
  const leaf = () => { const l = document.createElement('div'); l.className = 'fly'; const sz = rnd(12, 26), col = ['#8DBB6F', '#A9C95F', '#D1B65A', '#7CAE5E'][Math.floor(rnd(0, 4))];
    l.innerHTML = `<svg width="${sz}" height="${sz * .6}" viewBox="0 0 16 10"><path d="M0 5 C4 -2 12 -2 16 5 C12 12 4 12 0 5Z" fill="${col}"/><path d="M1 5 L15 5" stroke="rgba(0,0,0,.25)" stroke-width=".6"/></svg>`; $('#fly').appendChild(l);
    const y = rnd(15, 85), dur = rnd(2000, 3800); const a = l.animate([{ transform: `translate(-6vw,${y}vh) rotate(0deg)`, opacity: 0 }, { opacity: 1, offset: .08 }, { transform: `translate(112vw,${y - rnd(8, 34)}vh) rotate(${rnd(700, 1200)}deg)`, opacity: 1 }], { duration: dur, easing: 'cubic-bezier(.3,.1,.7,.9)' }); a.onfinish = () => l.remove(); };
  const gust = () => { if (document.hidden || reduce) return; gusting = true; scene.style.setProperty('--gustwind', (2.4 + 3 * G).toFixed(2)); scene.classList.add('gust');
    const n = Math.round(8 + 14 * G); for (let i = 0; i < n; i++) setTimeout(leaf, i * (4200 / n)); if (audio.on) audio.gust();
    setTimeout(() => { scene.classList.remove('gust'); gusting = false; }, 5400); };
  if (!reduce) { setTimeout(gust, 2500); (function loop() { setTimeout(() => { gust(); loop(); }, rnd(8000, 14000)); })(); }

  // JS-driven spin: the fan-flower heads ease between a base speed and a gust speed, so a gust never makes them jump
  let last = performance.now(); const hs = heads.map(() => 70);
  (function tick(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; const ease = Math.min(1, dt * 1.3);
    heads.forEach((h, i) => { hs[i] += ((reduce ? 0 : (gusting ? (260 + 360 * G) * h.k : 70 * h.k)) - hs[i]) * ease; h.ang = (h.ang + h.dir * hs[i] * dt) % 360; h.el.style.transform = `rotate(${h.ang}deg)`; });
    requestAnimationFrame(tick); })(last);

  // pointer parallax
  if (!reduce && matchMedia('(pointer:fine)').matches) addEventListener('pointermove', (e) => { const nx = e.clientX / innerWidth - .5, ny = e.clientY / innerHeight - .5;
    document.querySelectorAll('[data-depth]').forEach((el) => { const d = +el.dataset.depth; el.style.transform = `translate(${(-nx * d).toFixed(1)}px,${(-ny * d * .6).toFixed(1)}px)`; }); });

  // synthesized wind (reference for the feel only)
  const audio = { on: false, ctx: null,
    init() { const c = this.ctx = new (window.AudioContext || window.webkitAudioContext)(); const n = c.sampleRate * 3, buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0); let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < n; i++) { const w = Math.random() * 2 - 1; b0 = .99765 * b0 + w * .099046; b1 = .963 * b1 + w * .2965164; b2 = .57 * b2 + w * 1.0526913; d[i] = (b0 + b1 + b2 + w * .1848) * .11; }
      const mk = () => { const s = c.createBufferSource(); s.buffer = buf; s.loop = true; s.start(); return s; };
      this.master = c.createGain(); this.master.gain.value = .55; this.master.connect(c.destination);
      const lp = this.lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 560; lp.Q.value = .8; const wg = this.wg = c.createGain(); wg.gain.value = .55; mk().connect(lp); lp.connect(wg); wg.connect(this.master);
      const lfo = c.createOscillator(); lfo.frequency.value = .12; const ld = c.createGain(); ld.gain.value = .24; lfo.connect(ld); ld.connect(wg.gain); const lf2 = c.createGain(); lf2.gain.value = 200; lfo.connect(lf2); lf2.connect(lp.frequency); lfo.start();
      const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2600; const rg = this.rg = c.createGain(); rg.gain.value = .04; mk().connect(hp); hp.connect(rg); rg.connect(this.master);
      const l3 = c.createOscillator(); l3.frequency.value = .2; const l3g = c.createGain(); l3g.gain.value = .035; l3.connect(l3g); l3g.connect(rg.gain); l3.start(); },
    gust() { const c = this.ctx, t = c.currentTime, k = .7 + 1.1 * G; this.wg.gain.cancelScheduledValues(t); this.wg.gain.setTargetAtTime(.55 + .6 * k, t, .7); this.wg.gain.setTargetAtTime(.55, t + 3.4, 1.2); this.lp.frequency.setTargetAtTime(560 + 420 * k, t, .7); this.lp.frequency.setTargetAtTime(560, t + 3.4, 1.2); this.rg.gain.setTargetAtTime(.04 + .09 * k, t, .5); this.rg.gain.setTargetAtTime(.04, t + 3.4, 1); } };
  const play = $('#play'), state = $('#state'), bar = $('#bar');
  bar.classList.add('paused');
  play.addEventListener('click', async () => { if (!audio.ctx) audio.init(); if (audio.on) { await audio.ctx.suspend(); audio.on = false; play.textContent = '▶'; state.textContent = 'paused'; bar.classList.add('paused'); }
    else { await audio.ctx.resume(); audio.on = true; play.textContent = '❚❚'; state.textContent = 'wind in the valley'; bar.classList.remove('paused'); } });
  const setVol = (v) => { $('#vol').value = v; $('#vol2').value = v; if (audio.master) audio.master.gain.value = v / 100; };
  $('#vol').addEventListener('input', (e) => setVol(e.target.value)); $('#vol2').addEventListener('input', (e) => setVol(e.target.value));
  $('#gs').addEventListener('input', (e) => { G = e.target.value / 100; });
  $('#sbtn').addEventListener('click', () => { const o = $('#settings').classList.toggle('open'); $('#sbtn').setAttribute('aria-expanded', o); });

  // Chill mode: full screen, and the controls fade away when nothing moves
  $('#cm').addEventListener('click', () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); });
  let idle; const wake = () => { document.body.classList.remove('ui-idle'); clearTimeout(idle); idle = setTimeout(() => { if (!$('#settings').classList.contains('open')) document.body.classList.add('ui-idle'); }, 4500); };
  ['pointermove', 'keydown', 'pointerdown'].forEach((ev) => addEventListener(ev, wake)); wake();
})();
</script>
</body>
